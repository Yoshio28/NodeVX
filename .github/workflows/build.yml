name: Compilar NodeVX.exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Verificar
        run: |
          go vet ./...
          GOOS=windows go vet ./...
          node --check web/app.js
      - name: Compilar
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: NodeVX-windows-x64
          path: dist/NodeVX.exe
      - name: Publicar release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NodeVX.exe
